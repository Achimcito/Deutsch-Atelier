<!DOCTYPE html>
<html lang="de">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2ede6">
<title>Das Haus an der Lindauer Straße – Deutsch Atelier Adventures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfaf7;
  --ink:#26333b;
  --muted:#78858b;
  --blue:#547b98;
  --line:rgba(65,91,108,.2);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  background:var(--paper);
  font-family:Jost,sans-serif;
  font-weight:300;
}

.page{
  width:min(100% - 36px,980px);
  margin:auto;
  padding:24px 0 48px;
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}

.back{
  color:var(--muted);
  text-decoration:none;
  font-size:.9rem;
  letter-spacing:.03em;
}
.back:hover{color:var(--blue)}

.brand{
  text-align:right;
  line-height:1.1;
  color:var(--ink);
  font:500 1.25rem Cormorant Garamond,serif;
  letter-spacing:.04em;
}

.brand small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font:300 .65rem Jost,sans-serif;
  letter-spacing:.2em;
  text-transform:uppercase;
}

header{
  text-align:center;
  padding:34px 0 24px;
}

h1{
  margin:0;
  font:500 clamp(2rem,5vw,3.2rem)/1.05 Cormorant Garamond,serif;
}

.subtitle{
  margin:10px 0 0;
  color:var(--muted);
  font-size:.82rem;
  letter-spacing:.18em;
  text-transform:uppercase;
}

.scene{
  overflow:hidden;
  background:var(--paper);
  border:none;
  box-shadow:none;
}

.scene-image-frame{
  width:fit-content;
  max-width:100%;
  margin:0 auto;
  overflow:hidden;
  background:var(--paper);
  border:none;
  box-shadow:none;
}

.scene-image{
  display:block;
  width:auto;
  max-width:75%;
  max-height:570px;
  height:auto;
  margin:0 auto;
  object-fit:contain;
  background:transparent;
  border:1px solid rgba(65,91,108,.16);
  border-radius:4px;
  box-shadow:0 5px 18px rgba(25,30,35,.16);
}

.dialogue{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:18px;
  align-items:center;
  padding:24px clamp(14px,3vw,28px);
}

.speech-bubble{
  position:relative;
  min-width:0;
  background:#fff;
  border:1px solid var(--line);
  border-radius:5px;
}

.speech-bubble::after{
  content:"";
  position:absolute;
  top:28px;
  right:-9px;
  width:16px;
  height:16px;
  background:#fff;
  border-top:1px solid var(--line);
  border-right:1px solid var(--line);
  transform:rotate(45deg);
}

.story{
  padding:clamp(18px,4vw,30px);
  min-height:160px;
}

.character-slot{
  display:flex;
  justify-content:center;
  align-items:center;
  min-width:0;
}

.character-slot img{
  display:block;
  width:100%;
  max-width:150px;
  max-height:180px;
  object-fit:contain;
}

.story{
  padding:clamp(22px,5vw,38px);
  min-height:160px;
}

#storyText{
  margin:0;
  white-space:pre-line;
  color:var(--ink);
 font:400 clamp(1rem,2.2vw,1.23rem)/1.65 Cormorant Garamond,serif;
  letter-spacing:.01em;
}

.skip{
  display:block;
  margin:12px 0 0 auto;
  padding:4px 0;
  border:0;
  background:transparent;
  color:var(--blue);
  font:300 .78rem Jost,sans-serif;
  cursor:pointer;
}
.skip:hover{color:#26333b}

.interaction{
  margin-top:18px;
  padding:22px clamp(18px,4vw,30px) 26px;
  border-top:1px solid var(--line);
  background:#f5f4f0;
}

.prompt{
  display:block;
  margin-bottom:11px;
  color:#53636c;
  font-size:.9rem;
  letter-spacing:.06em;
}

.command-row{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  min-width:0;
  padding:13px 15px;
  border:1px solid rgba(65,91,108,.3);
  border-radius:2px;
  outline:none;
  background:#fff;
  color:var(--ink);
  font:400 1rem Jost,sans-serif;
}

input:focus{border-color:var(--blue)}
input::placeholder{color:#9ba4a7}

button[type=submit]{
  padding:0 22px;
  border:1px solid var(--blue);
  border-radius:2px;
  background:var(--blue);
  color:white;
  font:400 .9rem Jost,sans-serif;
  cursor:pointer;
}
button[type=submit]:hover{background:#3f6682}

#response{
  min-height:28px;
  margin:17px 0 0;
  color:var(--blue);
  font:400 1.12rem/1.5 Cormorant Garamond,serif;
  white-space:pre-line;
}

.footer{
  padding-top:26px;
  color:var(--muted);
  text-align:center;
  font-size:.72rem;
  letter-spacing:.08em;
}
  [hidden] {
  display: none !important;
}

@media(max-width:560px){
  .page{
    width:min(100% - 22px,980px);
    padding-top:15px;
  }
  header{padding:28px 0 20px}
  .command-row{flex-direction:column}
  button[type=submit]{min-height:44px}
  .scene-image{max-height:78vh}
  .dialogue{
  grid-template-columns:1fr;
  gap:10px;
}

.character-slot{
  justify-content:center;
}

.speech-bubble::after{
  display:none;
}
}
</style></head>
<body>
<main class="page">
<nav class="topline" aria-label="Navigation">
<a class="back" href="../index.html">← Zurück zu den Adventures</a>
<div class="brand">Deutsch Atelier<small>by Achim</small></div>
</nav>
<header>
<h1>Das Haus an der Lindauer Straße</h1>
<p class="subtitle">Ein geheimnisvolles Abenteuer · A2</p>
</header>
<section class="scene" aria-label="Aktuelle Szene">
<div class="scene-image-frame">
  <img id="sceneImage" class="scene-image" src="bilder/tor.jpg" alt="Ein altes, verrostetes Gittertor an der Lindauer Straße">
</div>

<div class="dialogue">
  <div class="speech-bubble">
    <div class="story">
      <p id="storyText" aria-live="polite"></p>
      <button class="skip" id="skipButton" type="button" hidden>Text vollständig anzeigen</button>
    </div>
  </div>

  <div class="character-slot">
    <img id="characterImage" src="" alt="" hidden>
  </div>
</div>
<form class="interaction" id="commandForm" hidden>
<label class="prompt" for="command">Was möchtest du tun?</label>
<div class="command-row">
<input id="command" name="command" type="text" autocomplete="off" placeholder="Schreibe deinen Befehl ..." required>
<button type="submit">Los</button>
</div>
<p id="response" aria-live="polite"></p>
</form>
</section>
<footer class="footer">Deutsch Atelier Adventures · Medellín</footer>
</main>
<script>
const openingText =
"Du stehst auf dem Bürgersteig der Lindauer Straße. Es ist sieben Uhr abends und es wird langsam dunkel.\n\n" +
"Rechts von dir siehst du ein verrostetes Gittertor. Dahinter liegt alles im Dunkeln. Google Maps zeigt hier aber kein Haus an.\n\n" +
"„Komisch“, denkst du ... und fasst das Tor an. Du merkst, dass es offen ist.";

const storyText=document.getElementById("storyText");
const skipButton=document.getElementById("skipButton");
const commandForm=document.getElementById("commandForm");
const commandInput=document.getElementById("command");
const response=document.getElementById("response");
const sceneImage=document.getElementById("sceneImage");
const characterImage=document.getElementById("characterImage");
function showCharacter(name){
  const characters={
    vlad:"bilder/vlad-kommentar.png",
    pepe:"bilder/pepe-kommentar.png"
  };

  characterImage.src=characters[name];
  characterImage.alt=name==="vlad"
    ?"Vlad, der Piranha"
    :"Pepe, der Papagei";

  characterImage.hidden=false;
}

function hideCharacter(){
  characterImage.hidden=true;
  characterImage.removeAttribute("src");
}
let failedAttempts=0; 
let amTor=true;
let imVorgarten=false;
let anDerAbzweigung=false;
let vorherigerOrt=null;
let amGrabstein=false;
let handylampe=false;
let lampStartTime=null;
let typingTimer=null;
let characterIndex=0;

  function speichereOrt(){
  vorherigerOrt={
    bild:sceneImage.getAttribute("src"),
    alt:sceneImage.alt,
    text:storyText.textContent,
    imVorgarten:imVorgarten,
    anDerAbzweigung:anDerAbzweigung,
    amGrabstein:amGrabstein,
    amTor:amTor,
    handylampe:handylampe,
    lampStartTime:lampStartTime
  };
}
  function geheZurueck(){
  if(!vorherigerOrt){
    response.textContent="Du kannst hier nicht weiter zurückgehen.";
    return;
  }

  const aktuellerOrt={
    bild:sceneImage.getAttribute("src"),
    alt:sceneImage.alt,
    text:storyText.textContent,
    imVorgarten:imVorgarten,
    amGrabstein:amGrabstein,
    amTor:amTor
  };

  const ziel=vorherigerOrt;
  vorherigerOrt=aktuellerOrt;

  sceneImage.src=ziel.bild;
  sceneImage.alt=ziel.alt;
  storyText.textContent=ziel.text;

  imVorgarten=ziel.imVorgarten;
  amGrabstein=ziel.amGrabstein;
  amTor=ziel.amTor;

  hideCharacter();
  response.textContent="";
}
let currentTypingText="";

function finishTyping(){
 if(typingTimer)clearTimeout(typingTimer);
 storyText.textContent=currentTypingText;
 skipButton.hidden=true;
 commandForm.hidden=false;

 if(!commandInput.disabled){
  commandInput.focus();
 }
}

function typeNextCharacter(){
 if(characterIndex>=currentTypingText.length){
  finishTyping();
  return;
 }

 const ch=currentTypingText.charAt(characterIndex++);
 storyText.textContent+=ch;

 let delay=29;
 if(".!?…".includes(ch))delay=420;
 else if(ch===",")delay=150;
 else if(ch==="\n")delay=260;

 typingTimer=setTimeout(typeNextCharacter,delay);
}

function startTyping(text){
 if(typingTimer)clearTimeout(typingTimer);

 currentTypingText=text;
 characterIndex=0;
 storyText.textContent="";
 skipButton.hidden=false;

 typeNextCharacter();
}

skipButton.addEventListener("click",finishTyping);
startTyping(openingText);

  function normalize(s){
 return s.toLocaleLowerCase("de")
  .replace(/[.!?,;:]/g,"")
  .replace(/ä/g,"ae")
  .replace(/ö/g,"oe")
  .replace(/ü/g,"ue")
  .replace(/ß/g,"ss")
  .trim()
  .replace(/\s+/g," ");
}
function verbleibendeMinuten(){
  if(!handylampe || !lampStartTime)return 30;

  const vergangen=Date.now()-lampStartTime;
  const rest=Math.max(0,30*60*1000-vergangen);

  return Math.ceil(rest/60000);
}
commandForm.addEventListener("submit",event=>{
 event.preventDefault();

 const command=normalize(commandInput.value);
 if(!command)return;

 let answer="Du überlegst kurz. Aber dir fällt gerade nichts ein, was du damit anfangen könntest.";
  let understood=false;
  let sceneChanged=false;
  if(
  command.includes("geh zurueck") ||
  command.includes("gehe zurueck") ||
  command.includes("geh zurueck zum vorherigen ort")
){
  if(vorherigerOrt){
    geheZurueck();
    answer=storyText.textContent;
    understood=true;
    sceneChanged=true;
  }else{
    answer="Du bist bereits am Anfang. Weiter zurück geht es nicht.";
    understood=true;
  }
}
  if(
  command.includes("benutze die handylampe")||
command.includes("schalte die handylampe ein")||
command.includes("mach die handylampe an")||
command.includes("ich benutze die handylampe")||
command.includes("ich schalte die handylampe ein")||
command.includes("ich mache die handylampe an")
){
  understood=true;

  if(!handylampe){
    handylampe=true;
    sceneImage.src="bilder/vorgarten-licht.jpg";
sceneImage.alt="Der verwilderte Vorgarten im Licht der Handylampe";
    lampStartTime=Date.now();

    answer="Du schaltest die Handylampe ein. Ein heller Lichtkegel durchbricht die Dunkelheit. Der Pfad zum Haus ist jetzt sichtbar.\n\nAber pass auf: Die Batterie hält nur 30 Minuten!";
  }else{
    answer="Die Handylampe ist bereits eingeschaltet. Der Akku wird nicht wieder voller.";
  }

  storyText.textContent=answer;
  sceneChanged=true;
}
 if(/(geh|gehe|lauf|laufe)\s*(nach hause|heim)/.test(command)||command.includes("ins bett")){
   understood=true;

  answer="Du beschließt, nach Hause zu gehen. Eine warme Dusche und dein Bett sind jetzt doch verlockender als dieses seltsame Tor.\n\nVlad würde sagen: „Das war aber nicht sehr mutig!“\n\nGAME OVER";

  sceneImage.src="bilder/schlafzimmer.jpg";
sceneImage.alt="Ein gemütliches Schlafzimmer";

characterImage.src="bilder/vlad.png";
characterImage.alt="Vlad, der Piranha";
characterImage.hidden=false;

storyText.textContent=answer;
skipButton.hidden=true;

  commandInput.disabled=true;
  commandForm.querySelector("button").disabled=true;

 }else if(/(oeffne|mach)\s*(tor|gitter)/.test(command)){
   understood=true;

  answer="Du versuchst, das Tor zu öffnen. Dabei bemerkst du, dass es gar nicht verschlossen ist. Es steht bereits einen Spalt offen.";

 }else if(/(geh|gehe|lauf|laufe)\s*(nach rechts|zum tor|ans tor|zum gitter)/.test(command)){
   understood=true;

  answer="Du gehst nach rechts und stehst jetzt direkt vor dem verrosteten Gittertor. Dahinter kannst du kaum etwas erkennen.";

 }else if(/(geh|gehe|lauf|laufe)\s*(durch das tor|durchs tor|durch das gitter|in den garten)/.test(command)){
  
  understood=true;
  speichereOrt();
imVorgarten=true;
amTor=false;
sceneChanged=true;
   

if(handylampe){
  sceneImage.src="bilder/vorgarten-licht.jpg";
  sceneImage.alt="Der verwilderte Vorgarten im Licht der Handylampe";
}else{
  sceneImage.src="bilder/vorgarten.jpg";
  sceneImage.alt="Ein dunkler, verwilderter Vorgarten";
}

  answer="Du stehst hinter dem schweren Eisentor. Ein schmaler, überwucherter Pfad führt zu einem alten Haus.\nDas hohe Gras ist nass und kalt. Es ist absolut still. Kein Wind. Kein Tier.\n\nDu schaust nach oben, aber du siehst nichts. Kein Mond. Kein einziger Stern. Der Himmel ist dunkelblau, fast schwarz. Du kannst kaum deine eigene Hand vor Augen sehen.";

  skipButton.hidden=true;
   }else if(imVorgarten && !amGrabstein && (
  command.includes("sieh auf das handy")||
  command.includes("sehe auf das handy")||
  command.includes("schau auf das handy")||
  command.includes("schaue auf das handy")
)){
  understood=true;

  if(handylampe){
    const minuten=verbleibendeMinuten();

    answer="Du siehst auf dein Handy. Deine Batterieanzeige blinkt. Du hast nur noch "+minuten+" Minuten Licht.";
  }else{
    answer="Du hast keinen Empfang. Nur ein schwaches Batteriesymbol blinkt dich an.";
  }
}else if(imVorgarten && !amGrabstein && (
  command.includes("sieh nach oben")||
  command.includes("sehe nach oben")||
  command.includes("schau nach oben")||
  command.includes("schaue nach oben")
)){
  understood=true;
  answer="Der Himmel ist dunkelblau. Es ist eine mond- und sternlose Nacht.";

}else if(imVorgarten && !amGrabstein && (
  command.includes("hoer genau hin")||
  command.includes("ich hoere genau hin")||
  command.includes("lausche")||
  command.includes("ich lausche")||
  command.includes("hoere genau hin")||
  command.includes("hoer hin")||
  command.includes("ich hoere hin")
)){
  understood=true;
  answer="Du hältst einen Moment lang ganz still und lauschst. Zuerst hörst du nichts. Dann raschelt irgendwo im Garten trockenes Laub. Es klingt, als wäre dort etwas.";

   }else if(imVorgarten && !amGrabstein && (
  command.includes("untersuche die bank")||
  command.includes("untersuche bank")||
  command.includes("geh zur bank")||
  command.includes("gehe zur bank")||
  command.includes("ich gehe zur bank")||
  command.includes("beruehre die bank")||
  command.includes("fass die bank an")
)){
  understood=true;
  answer="Die Bank ist aus altem, rostigem Eisen. Sie ist sehr kalt und von feuchtem Moos überwuchert.";

}else if(imVorgarten && !amGrabstein && (
  command.includes("setz dich auf die bank")||
  command.includes("setze mich auf die bank")||
  command.includes("ich setze mich auf die bank")
)){
  understood=true;
  answer="Du setzt dich vorsichtig auf die kalte Eisenbank. Das feuchte Moos fühlt sich unangenehm an. Einen Moment lang lauschst du der Stille.";

}else if(imVorgarten && !amGrabstein && (
  command.includes("schau unter die bank")||
  command.includes("schaue unter die bank")||
  command.includes("sieh unter die bank")||
  command.includes("sehe unter die bank")
)){
  understood=true;
  answer="Du gehst in die Hocke und schaust unter die Bank. Dort liegen nur nasse Blätter und kleine Zweige.";

   }else if(imVorgarten && !amGrabstein && (
  command.includes("geh zur steinsaeule")||
  command.includes("gehe zur steinsaeule")||
  command.includes("ich gehe zur steinsaeule")||
  command.includes("untersuche die steinsaeule")||
  command.includes("untersuche steinsaeule")||
  command.includes("beruehre die steinsaeule")||
  command.includes("fass die steinsaeule an")
)){
  understood=true;
  answer="Es ist eine eckige Säule aus Stein. Auf ihr steht eine große, alte Steinurne, aus der wilde Pflanzen wachsen.";

}else if(imVorgarten && !amGrabstein && (
  command.includes("untersuche die urne")||
  command.includes("untersuche urne")
)){
  understood=true;
  answer="Die große Steinurne ist alt und verwittert. Wilde Pflanzen wachsen aus ihr heraus.";

}else if(imVorgarten && !amGrabstein && (
  command.includes("sieh in die urne")||
  command.includes("schau in die urne")||
  command.includes("schaue in die urne")||
  command.includes("sehe in die urne")
)){
  understood=true;
  answer="Du blickst in die alte Steinurne. Zwischen den wilden Pflanzen kannst du im Dunkeln kaum etwas erkennen.";

   }else if((imVorgarten || amGrabstein) && (
  command.includes("untersuche den pfad")||
  command.includes("untersuche pfad")||
  command.includes("sieh dir den pfad an")||
  command.includes("schaue dir den pfad an")||
  command.includes("wie sieht der pfad aus")
)){
  understood=true;
  answer="Der Pfad ist von Pflanzen überwuchert und mit Gartensteinen übersät.";
   
 }else if(imVorgarten && (
  command.includes("folge dem pfad")||
  command.includes("folge dem weg")||
  command.includes("geh weiter")||
  command.includes("gehe weiter")||
  command.includes("lauf weiter")||
  command.includes("laufe weiter")||
  command.includes("geh den pfad entlang")||
  command.includes("gehe den pfad entlang")
)){
  understood=true;
  sceneChanged=true;

  if(!handylampe){
    speichereOrt();
    imVorgarten=false;
    amTor=true;

    sceneImage.src="bilder/tor.jpg";
    sceneImage.alt="Das schwere Eisentor";

    answer="Es ist zu dunkel. Du tappst blind durch das hohe Gras und stolperst über eine Wurzel. Mit Mühe findest du zurück zum Eisentor.";
  }else{
    speichereOrt();
    sceneImage.src="bilder/vorgarten-abzweig.jpg";
    sceneImage.alt="Die Abzweigung im verwilderten Garten";

    answer="Du folgst dem schmalen Pfad. Im Licht deiner Handylampe erkennst du eine Abzweigung. Ein kleiner Weg führt nach links ins Dickicht. Der Hauptweg führt weiter zum alten Haus.";
  }


  skipButton.hidden=true;  
   }else if(imVorgarten && (
  command.includes("geh nach links")||
  command.includes("gehe nach links")||
  command.includes("ich gehe nach links")||
  command.includes("geh links weiter")||
  command.includes("ich gehe links weiter")||
  command.includes("geh zum grab")||
  command.includes("gehe zum grab")||
  command.includes("ich gehe zum grab")||
  command.includes("gehe weiter zum grab")||
  command.includes("ich gehe weiter zum grab")
)){
  understood=true;
  sceneChanged=true;

  if(!handylampe){
    answer="Du tastest dich vorsichtig nach links. Aber es ist viel zu dunkel. Du kannst den Weg nicht erkennen und kehrst lieber um.";
  }else{
    speichereOrt();
    amGrabstein=true;
    sceneImage.src="bilder/grabstein.jpg";
    sceneImage.alt="Der alte Grabstein von Dolores Ayala";

    answer="Du verlässt den Hauptweg und gehst nach links. Der schmale Pfad führt dich tiefer ins Dickicht. Im Licht deiner Handylampe erkennst du plötzlich einen alten Grabstein. Du bist an einem Grab angekommen.";
  }

  skipButton.hidden=true;
}else if(amGrabstein && (
  command.includes("untersuche den grabstein")||
  command.includes("untersuche grabstein")||
  command.includes("ich untersuche den grabstein")||
  command.includes("ich untersuche den stein")
)){
  understood=true;
  answer="Der Stein ist alt und mit grünem Moos bedeckt. Du siehst einen Namen und zwei Daten.";

}else if(amGrabstein && (
  command.includes("lies den namen")||
  command.includes("lese den namen")||
  command.includes("ich lese den namen")
)){
  understood=true;
  answer="Auf dem Stein steht: Dolores Ayala.";

}else if(amGrabstein && (
  command.includes("lies die daten")||
  command.includes("lese die daten")||
  command.includes("ich lese die daten")
)){
  understood=true;
  answer="Geboren: 05.04.1793 | Gestorben: 31.10.1821";

}else if(amGrabstein && (
  command.includes("untersuche das moos")||
  command.includes("untersuche moos")||
  command.includes("ich untersuche das moos")
)){
  understood=true;
  answer="Das Moos ist dick und grün. Es wächst fast über den ganzen Stein.";

}else if(amGrabstein && (
  command.includes("sieh dich um")||
  command.includes("sehe mich um")||
  command.includes("schau dich um")||
  command.includes("schaue mich um")
)){
  understood=true;
  answer="Du siehst den Grabstein, den engen, verwilderten Pfad hinter dir und den rostigen Grundstückszaun. In der Ferne erkennst du eine Burg auf einem Hügel.";

}else if(amGrabstein && (
  command.includes("schau nach oben")||
  command.includes("schaue nach oben")||
  command.includes("sieh nach oben")||
  command.includes("sehe nach oben")
)){
  understood=true;
  answer="Der Himmel ist dunkel. Es ist eine kalte, mondlose Nacht.";

}else if(amGrabstein && (
  command.includes("grabe am grab")||
  command.includes("grabe am grabstein")||
  command.includes("ich grabe am grab")||
  command.includes("ich grabe am grabstein")
)){
  understood=true;
  answer="Der Boden ist hart und von Wurzeln durchsetzt. Du brichst dir einen Fingernagel ab. Autsch!";

}else if(amTor && (
  command.includes("sieh")||
  command.includes("schau")||
  command.includes("untersuch")
)){
  understood=true;
  answer="Du siehst dir das Tor genauer an. Der Rost ist alt, und das Metall fühlt sich kalt und feucht an. Das Tor ist tatsächlich offen.";
}

if(understood){
  failedAttempts=0;

  if(!commandInput.disabled){
    hideCharacter();
  }
}else{
  failedAttempts++;

  if(failedAttempts===1){
    showCharacter("vlad");
    answer="Was? Ich habe dich nicht verstanden.";
  }else{
    showCharacter("pepe");
    answer="Ich erklär es dir nochmal. Versuche es mit einem klaren Befehl, zum Beispiel: „Geh durch das Tor.“";
  }
}
if(sceneChanged){
  startTyping(answer);

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}
if(!commandInput.disabled){
  response.textContent=sceneChanged ? "" : answer;
}

commandInput.value="";

 if(!commandInput.disabled){
  commandInput.focus();
 }
});
</script>
